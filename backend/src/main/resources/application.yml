server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: cems-backend
  datasource:
    # Local H2 file database by default; overrides with CEMS_DB_URL for MySQL / Aiven / Docker
    url: ${CEMS_DB_URL:jdbc:h2:file:./data/cems;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
    username: ${CEMS_DB_USER:sa}
    password: ${CEMS_DB_PASSWORD:}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${CEMS_DDL_AUTO:update}

management:
  endpoints:
    web:
      exposure:
        include: health

cems:
  jwt:
    # MUST be overridden in production (>= 32 bytes): export CEMS_JWT_SECRET=...
    secret: ${CEMS_JWT_SECRET:dev-only-secret-please-change-me-in-production-0123456789}
    expiration-minutes: ${CEMS_JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CEMS_CORS_ORIGINS:*}
  seed:
    # Creates demo users/venues/events on an empty database. Set false in production.
    enabled: ${CEMS_SEED:true}
    demo-password: ${CEMS_DEMO_PASSWORD:cems@123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
